# Application Configuration
# Sensitive values (API keys, passwords) should be in config/.env

database:
  url: sqlite:///backend/data/product.db
  connect_args:
    check_same_thread: false

paths:
  uploads: backend/data/uploads
  logs: backend/logs

server:
  host: 0.0.0.0
  port: 8000
  frontend_origin: http://localhost:3000

ai:
  api_url: http://framework.gruru.net:11434/v1
  model: qwen3.6:35B
  prompt: >
    Analyze this stamp image and return a JSON object with these exact keys:
    product_name, brand_name, product_type, theme, shape_descriptor, sentiments.
    Use null for unknown fields. Example: {"product_name": "Test", "brand_name": null,
    "product_type": null, "theme": null, "shape_descriptor": null, "sentiments": null}.
    Return ONLY valid JSON, no markdown, no explanation.

image:
  allowed_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
  max_file_size: 1000000
